<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <script src="https://kit.fontawesome.com/5bb2c34d4a.js" crossorigin="anonymous"></script>
    <link rel="icon" type="images/x-icon" href="images/favicon/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <img src="images/biteboxlogo.png" alt="logo" width="200px">
            <ul>
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="bitedeals.html">Bite Deals</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
            </ul>
        </nav>
    </header>
    <!-- End of Header Section -->

    <section class="cart">
        <h2>Your Cart</h2>
        <table>
            <thead>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Remove</th>
            </thead>
            <tbody>
                <tr>
                    <td class="item">
                        <img src="images/burger.png">
                        <div>
                            <h4>Burger</h4>
                            <p>Juicy Burger</p>
                        </div>
                    </td>
                    <td>&#8377;120</td>
                    <td>
                        <div class="Quantity">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                    <td>&#8377;120</td>
                    <td><button class="remove">&#10060;</button></td>
                </tr>

                <tr>
                    <td class="item">
                        <img src="images/pizza.png">
                        <div>
                            <h4>Pizza</h4>
                            <p>Classic pizza</p>
                        </div>
                    </td>
                    <td>&#8377;180</td>
                    <td>
                        <div class="Quantity">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                    <td>&#8377;180</td>
                    <td><button class="remove">&#10060;</button></td>
                </tr>

                <tr>
                    <td class="item">
                        <img src="images/desserts.png">
                        <div>
                            <h4>Cheesecake</h4>
                            <p>Creamy baked</p>
                        </div>
                    </td>
                    <td>&#8377;350</td>
                    <td>
                        <div class="Quantity">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                    <td>&#8377;350</td>
                    <td><button class="remove">&#10060;</button></td>
                </tr>

                <tr class="grand-total">
                    <td colspan="3">Grand Total</td>
                    <td>&#8377;650</td>
                    <td><button>Proceed</button></td>
                </tr>


            </tbody>
        </table>
    </section>
</body>

</html>
